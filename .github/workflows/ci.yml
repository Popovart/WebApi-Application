name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WebApiApplication.slnx

      - name: Build
        run: dotnet build WebApiApplication.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution WebApiApplication.slnx --configuration Release --no-build
